name: Build & Push CN Localized Docker Image

on:
  push:
    branches: [cn-localized]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: cn-localized-build
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cn-localized

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=cn-localized
            type=sha,prefix=cn-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          no-cache: true
          build-args: |
            APP_VERSION=cn-latest
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build summary
        run: |
          echo "## CN Localized Build Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`ghcr.io/${{ github.repository }}:cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platform** | linux/amd64 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pushed** | ✅ Yes → GHCR |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 本次修复内容" >> $GITHUB_STEP_SUMMARY
          echo "- **Bug1: 旅行计划页面地图交互锁死** (点击天气弹窗后地图不能缩放/点击，F12控制台大量报错):" >> $GITHUB_STEP_SUMMARY
          echo "  - 根因: DayDetailPanel出现后AMap SDK内部坐标系统变得不一致，map.resize()调用时机不对导致NaN错误级联" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复1: overlay变化时立即调用map.resize()+setStatus()（不再延迟350ms），并在150/400/800ms后再次调用确保布局稳定" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复2: 每次resize后验证center/zoom是否为NaN，若为NaN则重置" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复3: 添加mousemove事件防抖健康检查，检测到NaN坐标时立即调用map.resize()" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复4: 增强模块级错误抑制器，覆盖console.error过滤AMap NaN噪音，保持控制台可用" >> $GITHUB_STEP_SUMMARY
          echo "- **Bug2: 旅程页面编辑条目地点搜索不工作** (JourneyDetailPage EntryEditor):" >> $GITHUB_STEP_SUMMARY
          echo "  - 根因: EntryEditor是模块级函数组件，但引用了JourneyDetailPage组件内的局部变量searchProviderSetting，导致ReferenceError被try-catch捕获后搜索始终返回空结果" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复: 在EntryEditor中添加useSettingsStore获取search_provider/amap_key/amap_web_service_key设置" >> $GITHUB_STEP_SUMMARY
