name: Build & Push CN Localized Docker Image

on:
  push:
    branches: [cn-localized]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: cn-localized-build
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cn-localized

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=cn-localized
            type=sha,prefix=cn-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          no-cache: true
          build-args: |
            APP_VERSION=cn-latest
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build summary
        run: |
          echo "## CN Localized Build Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`ghcr.io/${{ github.repository }}:cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platform** | linux/amd64 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pushed** | ✅ Yes → GHCR |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 本次修复内容" >> $GITHUB_STEP_SUMMARY
          echo "- **Bug1: 旅行计划页面地图交互锁死** (点击天气弹窗后地图不能缩放/点击):" >> $GITHUB_STEP_SUMMARY
          echo "  - 根因: 天气弹窗(DayDetailPanel)出现/消失后，AMap SDK内部坐标系统变得不一致，导致LngLat(NaN,NaN)错误" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复1: 添加ResizeObserver监听地图容器尺寸变化，自动调用map.resize()" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复2: 监听hasDayDetail/hasInspector变化，弹窗出现/消失后调用map.resize()+map.setStatus()重置交互状态" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复3: moveend/zoomend事件中添加健康检查，检测NaN center/zoom并自动恢复" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复4: 增强模块级错误抑制器，同时拦截error和unhandledrejection事件" >> $GITHUB_STEP_SUMMARY
          echo "- **Bug2: 旅程编辑条目地点搜索不工作** (JourneyDetailPage + PlaceFormModal):" >> $GITHUB_STEP_SUMMARY
          echo "  - 根因: AMap Web Service API使用JS API Key时返回USERKEY_PLAT_NOMATCH，后端静默返回空数组，前端不fallback" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复1: 前端搜索逻辑增加空结果fallback — AMap返回空结果时自动尝试Google/OSM搜索" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复2: 后端searchAmap增加API错误日志(console.warn)，便于排查Key配置问题" >> $GITHUB_STEP_SUMMARY
