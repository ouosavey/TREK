name: Build & Push CN Localized Docker Image

on:
  push:
    branches: [cn-localized]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cn-localized

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=cn-localized
            type=sha,prefix=cn-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          no-cache: true
          build-args: |
            APP_VERSION=cn-latest
            TREK_CN_LOCALIZED=1
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build summary
        run: |
          echo "## CN Localized Build Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`ghcr.io/${{ github.repository }}:cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platform** | linux/amd64 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pushed** | ✅ Yes → GHCR |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 本次修复内容" >> $GITHUB_STEP_SUMMARY
          echo "- **核心修复: 添加服务端自动分类兜底机制**" >> $GITHUB_STEP_SUMMARY
          echo "  - 根因: 前端分类匹配不可靠(React状态批处理/异步竞态/API失败/PWA缓存等)，cn.61~cn.63多次修前端仍无法保证100%正确" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复: 在服务端placeService.createPlace/updatePlace中添加自动分类兜底" >> $GITHUB_STEP_SUMMARY
          echo "  - 前端传递amap_category和amap_typecode，服务端使用映射逻辑自动查找或创建分类" >> $GITHUB_STEP_SUMMARY
          echo "  - 优势: 服务端逻辑确定性高，不受前端任何因素影响" >> $GITHUB_STEP_SUMMARY
