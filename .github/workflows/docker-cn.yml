name: Build & Push CN Localized Docker Image

on:
  push:
    branches: [cn-localized]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: cn-localized-build
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cn-localized

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=cn-localized
            type=sha,prefix=cn-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          no-cache: true
          build-args: |
            APP_VERSION=cn-latest
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build summary
        run: |
          echo "## CN Localized Build Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`ghcr.io/${{ github.repository }}:cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platform** | linux/amd64 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pushed** | ✅ Yes → GHCR |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 本次修复内容" >> $GITHUB_STEP_SUMMARY
          echo "- **Bug1: 旅行计划页面地图交互锁死** (点击天气弹窗后地图不能缩放/点击，F12控制台大量报错):" >> $GITHUB_STEP_SUMMARY
          echo "  - 根因: 高德天气API对不同日期返回不同格式数据（近3天简略/远期详细），导致DayDetailPanel面板大小差异大，触发AMap SDK坐标系统NaN错误级联" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复: 移除高德天气API，统一使用Open-Meteo天气数据（所有日期格式一致）" >> $GITHUB_STEP_SUMMARY
          echo "  - 同时保留: dayDetailId prop触发resize + 地图实例级坐标转换包装 + 周期性健康监控 + 错误抑制器" >> $GITHUB_STEP_SUMMARY
          echo "- **Bug2: 旅程页面保存地点后地图不显示/大量NaN报错:**" >> $GITHUB_STEP_SUMMARY
          echo "  - 根因: JourneyMapAMap加载了AMap.Scale插件（产生400+ NaN错误），且没有任何NaN防护（无monkey-patch、无错误抑制、无坐标包装）" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复1: 移除AMap.Scale插件（与MapViewAMap一致）" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复2: 添加完整的NaN防护体系（模块级错误抑制器 + LngLat/Pixel monkey-patch + 坐标转换包装 + 周期性健康监控）" >> $GITHUB_STEP_SUMMARY
          echo "- **Bug3: 旅程页面编辑条目地点搜索不工作** (已在上次提交修复):" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复: EntryEditor中添加useSettingsStore获取搜索设置" >> $GITHUB_STEP_SUMMARY
