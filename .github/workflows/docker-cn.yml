name: Build & Push CN Localized Docker Image

on:
  push:
    branches: [cn-localized]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: cn-localized-build
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cn-localized

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=cn-localized
            type=sha,prefix=cn-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          no-cache: true
          build-args: |
            APP_VERSION=cn-latest
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build summary
        run: |
          echo "## CN Localized Build Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`ghcr.io/${{ github.repository }}:cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platform** | linux/amd64 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pushed** | ✅ Yes → GHCR |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 本次修复内容" >> $GITHUB_STEP_SUMMARY
          echo "- **Bug1: 旅行计划页面地图灰掉/交互锁死:**" >> $GITHUB_STEP_SUMMARY
          echo "  - 删除blocker div和pointer-events方案，改为仅调用map.resize()" >> $GITHUB_STEP_SUMMARY
          echo "  - 参考main分支Leaflet逻辑：overlay变化时只做invalidateSize，不禁用交互" >> $GITHUB_STEP_SUMMARY
          echo "  - 保留LngLat/Pixel NaN-safe monkey-patch防止SDK内部崩溃" >> $GITHUB_STEP_SUMMARY
          echo "  - 保留周期性健康监控和mousemove NaN检测自动恢复" >> $GITHUB_STEP_SUMMARY
          echo "- **Bug2: 旅程页面地图不显示(NaN报错):**" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复invalidateSize实现：从toggle display改为map.resize()" >> $GITHUB_STEP_SUMMARY
          echo "  - 添加ResizeObserver监听容器尺寸变化自动resize" >> $GITHUB_STEP_SUMMARY
          echo "  - 保留v2错误抑制器+LngLat/Pixel monkey-patch+坐标验证" >> $GITHUB_STEP_SUMMARY
