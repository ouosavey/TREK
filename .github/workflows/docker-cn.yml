name: Build & Push CN Localized Docker Image

on:
  push:
    branches: [cn-localized]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: cn-localized-build
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cn-localized

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=cn-localized
            type=sha,prefix=cn-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          no-cache: true
          build-args: |
            APP_VERSION=cn-latest
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build summary
        run: |
          echo "## CN Localized Build Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`ghcr.io/${{ github.repository }}:cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platform** | linux/amd64 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pushed** | ✅ Yes → GHCR |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 本次修复内容" >> $GITHUB_STEP_SUMMARY
          echo "- **彻底根除地图交互锁死和 LngLat(NaN) 错误**:" >> $GITHUB_STEP_SUMMARY
          echo "  - 完全禁用 AMap.MarkerCluster 插件（从 plugins 加载和代码中移除）" >> $GITHUB_STEP_SUMMARY
          echo "  - 原因: MarkerCluster 在每次地图交互(缩放/平移/鼠标移动)时内部调用" >> $GITHUB_STEP_SUMMARY
          echo "    lngLatToContainer，任何 marker 坐标异常都会产生连续 Uncaught Error，" >> $GITHUB_STEP_SUMMARY
          echo "    导致地图事件循环中断、缩放/点击全部锁死" >> $GITHUB_STEP_SUMMARY
          echo "  - 旅行规划场景地点数量<100，不需要聚合功能" >> $GITHUB_STEP_SUMMARY
          echo "- **搜索框修复** (auto模式始终先尝试高德):" >> $GITHUB_STEP_SUMMARY
          echo "  - auto/amap 模式下始终先调用高德 autocomplete/search API" >> $GITHUB_STEP_SUMMARY
          echo "  - 高德失败时自动 fallback 到 Google/OSM（仅 auto 模式）" >> $GITHUB_STEP_SUMMARY
          echo "  - 不再依赖 hasAmapKey 前置判断，解决 settings 加载时序问题" >> $GITHUB_STEP_SUMMARY
