name: Build & Push CN Localized Docker Image

on:
  push:
    branches: [cn-localized]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: cn-localized-build
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cn-localized

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=cn-localized
            type=sha,prefix=cn-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          no-cache: true
          build-args: |
            APP_VERSION=cn-latest
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build summary
        run: |
          echo "## CN Localized Build Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`ghcr.io/${{ github.repository }}:cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platform** | linux/amd64 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pushed** | ✅ Yes → GHCR |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 本次修复内容" >> $GITHUB_STEP_SUMMARY
          echo "- **Bug1: 旅行计划页面地图交互锁死** (点击天气弹窗后地图灰掉/无法缩放，F12大量报错):" >> $GITHUB_STEP_SUMMARY
          echo "  - 根因: AMap SDK有太多内部代码路径产生NaN，事后拦截方案(monkey-patch/错误抑制)无法覆盖所有场景" >> $GITHUB_STEP_SUMMARY
          echo "  - 策略转变: 从'事后补救'改为'事前预防' — DayDetailPanel出现时在DOM层面用pointer-events:none阻断所有鼠标事件到达地图" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复1: overlay打开时设置container.style.pointerEvents='none'+禁用所有地图交互(scrollWheel/drag/zoom等)" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复2: overlay关闭时恢复pointer-events+多次延迟resize()恢复地图状态" >> $GITHUB_STEP_SUMMARY
          echo "  - 同时保留: 高德天气已移除统一Open-Meteo + dayDetailId prop + 坐标转换包装 + 健康监控" >> $GITHUB_STEP_SUMMARY
          echo "- **Bug2: 旅程页面地图不显示(672个NaN报错):**" >> $GITHUB_STEP_SUMMARY
          echo "  - 根因: JourneyMapAMap缺少NaN防护 + AMap.Scale插件产生大量错误" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复: 移除AMap.Scale + 完整NaN防护体系(错误抑制器+monkey-patch+坐标包装+健康监控)" >> $GITHUB_STEP_SUMMARY
