name: Build & Push CN Localized Docker Image

on:
  push:
    branches: [cn-localized]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: cn-localized-build
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cn-localized

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=cn-localized
            type=sha,prefix=cn-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          no-cache: true
          build-args: |
            APP_VERSION=cn-latest
            TREK_CN_LOCALIZED=1
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build summary
        run: |
          echo "## CN Localized Build Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`ghcr.io/${{ github.repository }}:cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platform** | linux/amd64 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pushed** | ✅ Yes → GHCR |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 本次修复内容" >> $GITHUB_STEP_SUMMARY
          echo "- **修复: 手机端点击公交/地铁按钮白屏**" >> $GITHUB_STEP_SUMMARY
          echo "  - 根因: TripPlannerPage移动端setRoute传入一维数组导致地图渲染崩溃(TypeError: number is not iterable)" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复: 坐标数据多层清洗防御+onRouteCalculated回调增加验证+try-catch" >> $GITHUB_STEP_SUMMARY
          echo "- **修复: 桌面端公交面板内容截断无法滚动**" >> $GITHUB_STEP_SUMMARY
          echo "  - 重构面板布局为flex三段式(标题固定+内容区独立滚动)" >> $GITHUB_STEP_SUMMARY
          echo "- **修复: 方案选中边框不跟随切换**" >> $GITHUB_STEP_SUMMARY
          echo "  - 点击方案时同时触发onSelect+onToggle" >> $GITHUB_STEP_SUMMARY
          echo "- **新增: 公交面板时间线式导航布局**" >> $GITHUB_STEP_SUMMARY
          echo "  - 绿色起点+红色终点+彩色时间轴+可折叠方案卡片" >> $GITHUB_STEP_SUMMARY
          echo "  - 方案标题简洁显示'地铁N条，公交N条'，点击展开详情" >> $GITHUB_STEP_SUMMARY
          echo "- **新增: 导出为图片功能**" >> $GITHUB_STEP_SUMMARY
          echo "  - 绿色相机按钮弹出菜单: 保存图片到本地 / 添加到旅行文件" >> $GITHUB_STEP_SUMMARY
          echo "- **新增: 图片预览缩放功能**" >> $GITHUB_STEP_SUMMARY
          echo "  - 鼠标滚轮/双指捏合缩放、双击放大、拖拽平移、键盘快捷键" >> $GITHUB_STEP_SUMMARY
          echo "- **去掉模拟占位数据**" >> $GITHUB_STEP_SUMMARY
          echo "  - 移除列车到站时间/拥挤度/强冷弱冷/首末班/票价估算(高德API不提供)" >> $GITHUB_STEP_SUMMARY
          echo "  - 去掉金额显示" >> $GITHUB_STEP_SUMMARY
