name: Build & Push CN Localized Docker Image

on:
  push:
    branches: [cn-localized]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: cn-localized-build
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cn-localized

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=cn-localized
            type=sha,prefix=cn-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          no-cache: true
          build-args: |
            APP_VERSION=cn-latest
            TREK_CN_LOCALIZED=1
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build summary
        run: |
          echo "## CN Localized Build Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`ghcr.io/${{ github.repository }}:cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platform** | linux/amd64 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pushed** | ✅ Yes → GHCR |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 本次修复内容" >> $GITHUB_STEP_SUMMARY
          echo "- **修复: 恢复公交地铁路线导出图片到完美版本**" >> $GITHUB_STEP_SUMMARY
          echo "  - 恢复到commit 77b7623版本的captureCanvas函数" >> $GITHUB_STEP_SUMMARY
          echo "  - DOM操作：position:fixed→relative、移除maxHeight/overflow限制" >> $GITHUB_STEP_SUMMARY
          echo "  - 遮罩层隐藏（data-transit-overlay属性精确定位）" >> $GITHUB_STEP_SUMMARY
          echo "  - 内部滚动容器移除溢出隐藏，解决底部截断" >> $GITHUB_STEP_SUMMARY
          echo "  - inline-flex微调文字位置（强制垂直居中+防止换行）" >> $GITHUB_STEP_SUMMARY
          echo "- **修复: F12控制台CSP报错**" >> $GITHUB_STEP_SUMMARY
          echo "  - 根因: CSP connectSrc缺少fonts.loli.net和gstatic.loli.net" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复: 在connectSrc中添加字体CDN域名，html-to-image截图时不再被阻止" >> $GITHUB_STEP_SUMMARY
