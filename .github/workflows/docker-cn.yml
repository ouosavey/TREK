name: Build & Push CN Localized Docker Image

on:
  push:
    branches: [cn-localized]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: cn-localized-build
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cn-localized

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=cn-localized
            type=sha,prefix=cn-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          no-cache: true
          build-args: |
            APP_VERSION=cn-latest
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build summary
        run: |
          echo "## CN Localized Build Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`ghcr.io/${{ github.repository }}:cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platform** | linux/amd64 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pushed** | ✅ Yes → GHCR |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 本次修复内容" >> $GITHUB_STEP_SUMMARY
          echo "- **Bug1: 旅行计划页面点击天气地图灰掉:**" >> $GITHUB_STEP_SUMMARY
          echo "  - 根本原因: DayDetailPanel/PlaceInspector使用position:fixed，不改变地图容器尺寸" >> $GITHUB_STEP_SUMMARY
          echo "  - 之前overlay变化时调用map.resize()导致AMap内部坐标系统重算产生NaN" >> $GITHUB_STEP_SUMMARY
          echo "  - 参考main分支: Leaflet版本overlay变化时不调用invalidateSize()" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复: 删除overlay resize effect，仅保留ResizeObserver处理真实容器尺寸变化" >> $GITHUB_STEP_SUMMARY
          echo "- **Bug2: 旅程页面地图不显示(大量NaN报错):**" >> $GITHUB_STEP_SUMMARY
          echo "  - 根本原因: 地图初始化useEffect依赖entries，每次数据变化都销毁重建地图" >> $GITHUB_STEP_SUMMARY
          echo "  - 参考MapViewAMap模式: 地图只初始化一次(依赖amapKey)，标记/折线/边界在单独effect更新" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复: 分离地图初始化和标记渲染，避免频繁重建触发NaN" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复invalidateSize: 从toggle display改为map.resize()" >> $GITHUB_STEP_SUMMARY
