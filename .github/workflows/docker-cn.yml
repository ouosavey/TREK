name: Build & Push CN Localized Docker Image

on:
  push:
    branches: [cn-localized]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cn-localized

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=cn-localized
            type=sha,prefix=cn-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          no-cache: true
          build-args: |
            APP_VERSION=cn-latest
            TREK_CN_LOCALIZED=1
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build summary
        run: |
          echo "## CN Localized Build Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`ghcr.io/${{ github.repository }}:cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platform** | linux/amd64 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pushed** | ✅ Yes → GHCR |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 本次修复内容" >> $GITHUB_STEP_SUMMARY
          echo "- **核心修复: APK 端多边形搜索结果导航无法调用高德地图 v3.0.22-cn.97**" >> $GITHUB_STEP_SUMMARY
          echo "  - 根因: 多边形搜索结果使用 https://uri.amap.com/ web URL，在 Capacitor WebView 中被系统 Intent 错误分发给天翼云盘等 App" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复: 新建统一导航函数 amapNavigate.ts，原生/移动端优先使用 androidamap:// deep link 唤起高德 App" >> $GITHUB_STEP_SUMMARY
          echo "  - MapViewAMap: handleNavigate + InfoWindow 导航改用 deep link" >> $GITHUB_STEP_SUMMARY
          echo "  - PlaceInspector/DayPlanSidebar/PlacesSidebar: 统一调用 openAmapNavigation() 函数" >> $GITHUB_STEP_SUMMARY
          echo "  - DayPlanSidebar handleAmapNav: 新增多点导航 openAmapMultiRouteNavigation()" >> $GITHUB_STEP_SUMMARY
