name: Build & Push CN Localized Docker Image

on:
  push:
    branches: [cn-localized]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: cn-localized-build
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cn-localized

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=cn-localized
            type=sha,prefix=cn-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          no-cache: true
          build-args: |
            APP_VERSION=cn-latest
            TREK_CN_LOCALIZED=1
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build summary
        run: |
          echo "## CN Localized Build Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`ghcr.io/${{ github.repository }}:cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platform** | linux/amd64 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pushed** | ✅ Yes → GHCR |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 本次修复内容" >> $GITHUB_STEP_SUMMARY
          echo "- **增强: 公交/地铁面板全面优化 (方案C):**" >> $GITHUB_STEP_SUMMARY
          echo "  - 按钮文字改为\"公交/地铁\"" >> $GITHUB_STEP_SUMMARY
          echo "  - 后端: 返回费用信息(cost)和线路颜色(lineColor)" >> $GITHUB_STEP_SUMMARY
          echo "  - 前端: 重构TransitRoutePanel - 折叠态只显示摘要,点击展开显示详细站点信息" >> $GITHUB_STEP_SUMMARY
          echo "  - 前端: 方案卡片顶部指标条(时间/费用/步行距离/线路数)" >> $GITHUB_STEP_SUMMARY
          echo "  - 前端: 地铁段用线路颜色标识(基于线路号生成HSL颜色)" >> $GITHUB_STEP_SUMMARY
          echo "  - 前端: 新增换乘策略选择器(最快/最省钱/最少换乘/少步行),切换时自动重新查询" >> $GITHUB_STEP_SUMMARY
          echo "  - 前端: 站点信息移入展开区域,带绿色起点/红色终点标记" >> $GITHUB_STEP_SUMMARY
