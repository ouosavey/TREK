name: Build & Push CN Localized Docker Image

on:
  push:
    branches: [cn-localized]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: cn-localized-build
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cn-localized

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=cn-localized
            type=sha,prefix=cn-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          no-cache: true
          build-args: |
            APP_VERSION=cn-latest
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build summary
        run: |
          echo "## CN Localized Build Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`ghcr.io/${{ github.repository }}:cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platform** | linux/amd64 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pushed** | ✅ Yes → GHCR |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 本次修复内容" >> $GITHUB_STEP_SUMMARY
          echo "- **地图锁死: 3层全局错误拦截器** (window.onerror + unhandledrejection + console.error)" >> $GITHUB_STEP_SUMMARY
          echo "  - AMap SDK 通过3种不同机制抛出坐标验证错误，全部拦截" >> $GITHUB_STEP_SUMMARY
          echo "  - isAmapNaNError() 统一匹配 Invalid Object: LngLat/Pixel(NaN)" >> $GITHUB_STEP_SUMMARY
          echo "- **编辑条目地点搜索框修复** (JourneyDetailPage.tsx):" >> $GITHUB_STEP_SUMMARY
          echo "  - 根因: 搜索条件限制 mapProvider===amap || 中文输入，非中文时永远不走高德" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复: auto/amap模式始终先尝试高德API，失败后fallback到Google/OSM" >> $GITHUB_STEP_SUMMARY
          echo "  - 注意: 这是 JourneyDetailPage 内联的搜索逻辑（不是 PlaceFormModal）" >> $GITHUB_STEP_SUMMARY
