name: Build & Push CN Localized Docker Image

on:
  push:
    branches: [cn-localized]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: cn-localized-build
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cn-localized

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=cn-localized
            type=sha,prefix=cn-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          no-cache: true
          build-args: |
            APP_VERSION=cn-latest
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build summary
        run: |
          echo "## CN Localized Build Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`ghcr.io/${{ github.repository }}:cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platform** | linux/amd64 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pushed** | ✅ Yes → GHCR |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 本次修复内容" >> $GITHUB_STEP_SUMMARY
          echo "- **Bug1: 旅行计划页面地图灰掉(天气弹窗后):**" >> $GITHUB_STEP_SUMMARY
          echo "  - 之前用container.style.pointerEvents='none'可能影响AMap瓦片渲染" >> $GITHUB_STEP_SUMMARY
          echo "  - 改为透明遮罩层div方案: 在地图容器上方叠加invisible blocker div" >> $GITHUB_STEP_SUMMARY
          echo "  - overlay打开时显示blocker(div display:block)拦截所有鼠标事件" >> $GITHUB_STEP_SUMMARY
          echo "  - overlay关闭时隐藏blocker(div display:none)恢复地图交互" >> $GITHUB_STEP_SUMMARY
          echo "  - 地图容器CSS保持不变，确保AMap正常渲染瓦片" >> $GITHUB_STEP_SUMMARY
          echo "- **Bug2: 旅程页面地图不显示(388个NaN报错):**" >> $GITHUB_STEP_SUMMARY
          echo "  - 升级错误抑制器v2: capture+bubbling双阶段拦截 + console.error/warn双重覆盖" >> $GITHUB_STEP_SUMMARY
          echo "  - 数据层坐标验证: isValidCoord()过滤NaN/Infinity/越界坐标" >> $GITHUB_STEP_SUMMARY
          echo "  - 地图初始化/折线/标记/边界适配全部使用验证后的坐标数据" >> $GITHUB_STEP_SUMMARY
