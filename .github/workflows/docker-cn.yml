name: Build & Push CN Localized Docker Image

on:
  push:
    branches: [cn-localized]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: cn-localized-build
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cn-localized

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=cn-localized
            type=sha,prefix=cn-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          no-cache: true
          build-args: |
            APP_VERSION=cn-latest
            TREK_CN_LOCALIZED=1
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build summary
        run: |
          echo "## CN Localized Build Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`ghcr.io/${{ github.repository }}:cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platform** | linux/amd64 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pushed** | ✅ Yes → GHCR |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 本次修复内容" >> $GITHUB_STEP_SUMMARY
          echo "- **修复: 导出图片全白**" >> $GITHUB_STEP_SUMMARY
          echo "  - 根因: 克隆节点方案导致双重克隆+离屏定位，SVG foreignObject渲染失败" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复: 回退到直接在原面板上调用toCanvas，用height/width参数覆盖canvas尺寸" >> $GITHUB_STEP_SUMMARY
          echo "  - 临时移除maxHeight获取scrollHeight，立即恢复，传给toCanvas作为完整尺寸" >> $GITHUB_STEP_SUMMARY
