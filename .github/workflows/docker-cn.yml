name: Build & Push CN Localized Docker Image

on:
  push:
    branches: [cn-localized]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cn-localized

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=cn-localized
            type=sha,prefix=cn-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          no-cache: true
          build-args: |
            APP_VERSION=cn-latest
            TREK_CN_LOCALIZED=1
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build summary
        run: |
          echo "## CN Localized Build Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`ghcr.io/${{ github.repository }}:cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platform** | linux/amd64 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pushed** | ✅ Yes → GHCR |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 本次修复内容" >> $GITHUB_STEP_SUMMARY
          echo "- **修复: findAmapCategoryMapping 缺少 typecode 前2位回退（核心根因）**" >> $GITHUB_STEP_SUMMARY
          echo "  - 根因: 高德某些POI不返回type字段但返回typecode，原代码在category为空且typecode前4位不在映射表时返回null" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复: 添加AMAP_TYPECODE_PREFIX2_MAP（typecode前2位→一级分类），覆盖全部23个大类" >> $GITHUB_STEP_SUMMARY
          echo "  - 示例: 八达岭长城typecode=110200，前2位11→风景名胜→景点" >> $GITHUB_STEP_SUMMARY
          echo "- **修复: 保存按钮竞态条件**" >> $GITHUB_STEP_SUMMARY
          echo "  - 根因: details API加载中时保存按钮可点击，导致category_id为空的地点被保存" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复: 保存按钮disabled条件添加isSearchingMaps" >> $GITHUB_STEP_SUMMARY
          echo "- **修复: AMap details获取失败无提示**" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复: 添加toast.error提示用户分类可能无法自动匹配" >> $GITHUB_STEP_SUMMARY
