name: Build & Push CN Localized Docker Image

on:
  push:
    branches: [cn-localized]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: cn-localized-build
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cn-localized

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=cn-localized
            type=sha,prefix=cn-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          no-cache: true
          build-args: |
            APP_VERSION=cn-latest
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build summary
        run: |
          echo "## CN Localized Build Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`ghcr.io/${{ github.repository }}:cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platform** | linux/amd64 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pushed** | ✅ Yes → GHCR |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 本次修复内容" >> $GITHUB_STEP_SUMMARY
          echo "- **地图交互锁死根除 (最终方案)**: 全局 window.onerror 拦截器" >> $GITHUB_STEP_SUMMARY
          echo "  - AMap SDK 内部事件循环(缩放/平移/鼠标)产生同步 Uncaught Error" >> $GITHUB_STEP_SUMMARY
          echo "  - try-catch 无法拦截 SDK 内部异步抛出的错误" >> $GITHUB_STEP_SUMMARY
          echo "  - 方案: 安装 window.onerror 过滤器，拦截 Invalid Object: LngLat/Pixel(NaN)" >> $GITHUB_STEP_SUMMARY
          echo "  - 组件卸载时自动恢复原始 error handler，不影响其他错误报告" >> $GITHUB_STEP_SUMMARY
          echo "- **safeGcj 增强**: 额外过滤 (0,0) 默认坐标占位值" >> $GITHUB_STEP_SUMMARY
          echo "- **搜索框调试日志**: 添加 [Search] 前缀的 console.log 到完整调用链" >> $GITHUB_STEP_SUMMARY
          echo "  - debounce → fetchSuggestions → API 调用 → 结果处理 全链路可追踪" >> $GITHUB_STEP_SUMMARY
          echo "  - 请在 F12 Console 中查看 [Search] 日志确认搜索流程执行情况" >> $GITHUB_STEP_SUMMARY
