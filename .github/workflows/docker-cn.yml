name: Build & Push CN Localized Docker Image

on:
  push:
    branches: [cn-localized]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cn-localized

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=cn-localized
            type=sha,prefix=cn-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          no-cache: true
          build-args: |
            APP_VERSION=cn-latest
            TREK_CN_LOCALIZED=1
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build summary
        run: |
          echo "## CN Localized Build Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`ghcr.io/${{ github.repository }}:cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platform** | linux/amd64 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pushed** | ✅ Yes → GHCR |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 本次修复内容" >> $GITHUB_STEP_SUMMARY
          echo "- **优化: APK 图标替换为 PWA 图标**" >> $GITHUB_STEP_SUMMARY
          echo "  - 用 PWA 图标替换 Capacitor 默认图标（绿色机器人）" >> $GITHUB_STEP_SUMMARY
          echo "  - 生成 Android 各尺寸的 ic_launcher 和 ic_launcher_foreground" >> $GITHUB_STEP_SUMMARY
          echo "  - 背景色改为 TREK 深色背景（#0f172a），与 PWA 一致" >> $GITHUB_STEP_SUMMARY
