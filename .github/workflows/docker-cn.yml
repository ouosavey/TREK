name: Build & Push CN Localized Docker Image

on:
  push:
    branches: [cn-localized]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cn-localized

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=cn-localized
            type=sha,prefix=cn-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          no-cache: true
          build-args: |
            APP_VERSION=cn-latest
            TREK_CN_LOCALIZED=1
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build summary
        run: |
          echo "## CN Localized Build Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`ghcr.io/${{ github.repository }}:cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platform** | linux/amd64 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pushed** | ✅ Yes → GHCR |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 本次修复内容" >> $GITHUB_STEP_SUMMARY
          echo "- **修复: PWA Service Worker 缓存导致前端代码未更新（核心根因）**" >> $GITHUB_STEP_SUMMARY
          echo "  - 根因: PWA 配置没有 skipWaiting/clientsClaim，新版本 Service Worker 不立即激活，用户浏览器使用旧前端代码缓存" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复: 添加 skipWaiting: true 和 clientsClaim: true，新版本立即激活" >> $GITHUB_STEP_SUMMARY
          echo "- **修复: onCategoryCreated 类型签名错误**" >> $GITHUB_STEP_SUMMARY
          echo "  - 根因: 类型签名声明返回 void，但实际使用 await 期望返回 Promise" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复: 改为 Promise<Category | undefined>，TripPlannerPage 改为 async 箭头函数" >> $GITHUB_STEP_SUMMARY
          echo "- **修复: Category 接口缺少 color 字段 + AmapPoi 接口缺少 typecode 字段**" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复: 补充类型定义" >> $GITHUB_STEP_SUMMARY
          echo "- **修复: Google/OSM 路径和搜索结果列表点击缺少 await**" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复: 所有调用 handleSelectMapsResult 的路径都添加 await" >> $GITHUB_STEP_SUMMARY
          echo "- **改进: 分类创建失败不再静默吞掉**" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复: 添加 toast.error 错误提示 + console.error 日志 + 详细诊断日志" >> $GITHUB_STEP_SUMMARY
