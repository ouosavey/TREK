name: Build & Push CN Localized Docker Image

on:
  push:
    branches: [cn-localized]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cn-localized

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=cn-localized
            type=sha,prefix=cn-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          no-cache: true
          build-args: |
            APP_VERSION=cn-latest
            TREK_CN_LOCALIZED=1
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build summary
        run: |
          echo "## CN Localized Build Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`ghcr.io/${{ github.repository }}:cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platform** | linux/amd64 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`cn-localized\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pushed** | ✅ Yes → GHCR |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 本次修复内容" >> $GITHUB_STEP_SUMMARY
          echo "- **修复: 地点无分类根因（权限限制+竞态条件）**" >> $GITHUB_STEP_SUMMARY
          echo "  - 根因1: POST /api/categories 有 adminOnly 中间件，非管理员调用返回 403，分类创建失败被静默吞掉" >> $GITHUB_STEP_SUMMARY
          echo "  - 根因2: PlaceFormModal 中 handleSelectMapsResult 未被 await，分类创建未完成就提交地点表单" >> $GITHUB_STEP_SUMMARY
          echo "  - 修复: 移除 adminOnly 中间件 + 添加 await 确保分类创建完成" >> $GITHUB_STEP_SUMMARY
          echo "- **新增: 多边形搜索结果按距离排序**" >> $GITHUB_STEP_SUMMARY
          echo "  - haversine 距离计算，由近到远排序，列表项和信息窗口显示距离" >> $GITHUB_STEP_SUMMARY
          echo "- **新增: 多边形搜索结果导航功能**" >> $GITHUB_STEP_SUMMARY
          echo "  - 调用高德 URI API 唤起导航，callnative=1 尝试唤起高德 App" >> $GITHUB_STEP_SUMMARY
